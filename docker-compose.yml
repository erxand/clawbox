services:
  openclaw-work:
    build: .
    container_name: openclaw-work
    restart: "no"

    ports:
      - "127.0.0.1:18790:18789"  # Gateway (loopback-only)
      - "127.0.0.1:3000:3000"    # Dev app server (loopback-only)
      - "127.0.0.1:3001:3001"    # Dev app server 2 (loopback-only)

    volumes:
      - openclaw-work-state:/home/node/.openclaw
      # Host repos mounted read-only — agent can clone but cannot write back
      - ${REPOS_PATH:-/Users/arclo/.openclaw/workspace/projects}:/host-repos:ro

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - OPENCLAW_DEFAULT_MODEL=${OPENCLAW_DEFAULT_MODEL:-anthropic/claude-haiku-4-5}
      - OPENCLAW_TOOLS_PROFILE=${OPENCLAW_TOOLS_PROFILE:-coding}
      # Set to 1 to re-enable web_search, web_fetch, and browser tools.
      # Default is 0 (disabled) — agent cannot browse the internet.
      # The agent can still make outbound calls via npm/fetch in code it runs.
      - OPENCLAW_ALLOW_WEB=${OPENCLAW_ALLOW_WEB:-0}

    # ── Resource limits ─────────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 512   # Kernel cgroup PID cap (second layer beyond nproc ulimit)

    # ── Security hardening ──────────────────────────────────────────
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      nproc:
        soft: 256
        hard: 512
    tmpfs:
      - /tmp:size=256m,mode=1777

    healthcheck:
      test: ["CMD", "sh", "-c", "openclaw gateway health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  openclaw-work-state:
