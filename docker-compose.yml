networks:
  clawbox-internal:
    internal: true   # NO external routing — containers here cannot reach internet directly
  clawbox-egress:    # Only connects clawbox-work to the proxy
    driver: bridge

services:
  clawbox-egress-proxy:
    build:
      context: proxy
    container_name: clawbox-egress-proxy
    restart: unless-stopped
    networks:
      - clawbox-egress
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(8888,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  clawbox-work:
    build: .
    container_name: clawbox-work
    restart: "no"

    depends_on:
      clawbox-egress-proxy:
        condition: service_healthy

    networks:
      - clawbox-internal  # No direct internet
      - clawbox-egress    # Can reach proxy only

    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18790}:18789"  # Gateway (loopback-only)
      # App server ports — uncomment when running dev servers in the container.
      # By default these are NOT mapped to avoid conflicting with your local dev server.
      # - "127.0.0.1:3000:3000"
      # - "127.0.0.1:3001:3001"

    volumes:
      - clawbox-work-state:/home/node/.openclaw
      # Host repos mounted read-only — agent can clone but cannot write back
      - ${REPOS_PATH:-/Users/arclo/.openclaw/workspace/projects}:/host-repos:ro

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - OPENCLAW_DEFAULT_MODEL=${OPENCLAW_DEFAULT_MODEL:-anthropic/claude-opus-4-6}
      - OPENCLAW_TOOLS_PROFILE=${OPENCLAW_TOOLS_PROFILE:-coding}
      # Note: no GITHUB_TOKEN here intentionally — container agent should not
      # have push/pull access to GitHub repos. Repo management stays with the human.
      # Set to 1 to re-enable web_search, web_fetch, and browser tools.
      # Default is 0 (disabled) — agent cannot browse the internet.
      # The agent can still make outbound calls via npm/fetch in code it runs.
      - OPENCLAW_ALLOW_WEB=${OPENCLAW_ALLOW_WEB:-0}
      # ── Read-only rootfs support: redirect writable state to volume ──
      # git config writes go to volume instead of ~/.gitconfig on the rootfs.
      # npm cache redirected to volume (npmrc NPM_CONFIG_CACHE → .npm-cache).
      # These env vars are picked up automatically by git and npm.
      - GIT_CONFIG_GLOBAL=/home/node/.openclaw/.gitconfig
      - NPM_CONFIG_CACHE=/home/node/.openclaw/.npm-cache
      # ── Egress proxy: route ALL outbound HTTPS through the allowlist proxy ──
      - HTTPS_PROXY=http://clawbox-egress-proxy:8888
      - HTTP_PROXY=http://clawbox-egress-proxy:8888
      # Also set for Node.js native fetch / undici (used by Anthropic SDK)
      - NODE_OPTIONS=--require /home/node/proxy-bootstrap.js

    # ── Resource limits ─────────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 10g
          cpus: "1.0"
          pids: 512   # Kernel cgroup PID cap (second layer beyond nproc ulimit)

    # ── Security hardening ──────────────────────────────────────────
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      nproc:
        soft: 256
        hard: 512
    # ── Read-only root filesystem ───────────────────────────────────
    # The container rootfs is read-only — attackers and rogue agent code
    # cannot modify binaries, libraries, or system files.
    # All legitimate writes go to:
    #   - /tmp (tmpfs, cleared on restart)
    #   - /run (tmpfs, for runtime state)
    #   - /home/node/.openclaw (persistent volume — workspace, configs, cache)
    # GIT_CONFIG_GLOBAL and NPM_CONFIG_CACHE redirect writes to the volume.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=32m,mode=1777

    healthcheck:
      test: ["CMD", "sh", "-c", "openclaw gateway health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clawbox-work-state:
