services:
  clawbox-work:
    build: .
    container_name: clawbox-work
    restart: "no"

    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18790}:18789"  # Gateway (loopback-only)
      # App server ports — uncomment when running dev servers in the container.
      # By default these are NOT mapped to avoid conflicting with your local dev server.
      # - "127.0.0.1:3000:3000"
      # - "127.0.0.1:3001:3001"

    volumes:
      - clawbox-work-state:/home/node/.openclaw
      # Host repos mounted read-only — agent can clone but cannot write back
      - ${REPOS_PATH:-/Users/arclo/.openclaw/workspace/projects}:/host-repos:ro

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - OPENCLAW_DEFAULT_MODEL=${OPENCLAW_DEFAULT_MODEL:-anthropic/claude-opus-4-6}
      - OPENCLAW_TOOLS_PROFILE=${OPENCLAW_TOOLS_PROFILE:-coding}
      # Note: no GITHUB_TOKEN here intentionally — container agent should not
      # have push/pull access to GitHub repos. Repo management stays with the human.
      # Set to 1 to re-enable web_search, web_fetch, and browser tools.
      # Default is 0 (disabled) — agent cannot browse the internet.
      # The agent can still make outbound calls via npm/fetch in code it runs.
      - OPENCLAW_ALLOW_WEB=${OPENCLAW_ALLOW_WEB:-0}

    # ── Resource limits ─────────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 10g
          cpus: "1.0"
          pids: 512   # Kernel cgroup PID cap (second layer beyond nproc ulimit)

    # ── Security hardening ──────────────────────────────────────────
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      nproc:
        soft: 256
        hard: 512
    tmpfs:
      - /tmp:size=256m,mode=1777

    healthcheck:
      test: ["CMD", "sh", "-c", "openclaw gateway health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clawbox-work-state:
