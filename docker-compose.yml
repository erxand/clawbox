services:
  openclaw-work:
    build: .
    container_name: openclaw-work
    restart: "no"
    ports:
      - "127.0.0.1:18790:18789"
    volumes:
      - openclaw-work-state:/home/node/.openclaw
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      # Override the default LLM model (default: anthropic/claude-haiku-4-5)
      # Set OPENCLAW_DEFAULT_MODEL in .env to change. Only applies on first run.
      - OPENCLAW_DEFAULT_MODEL=${OPENCLAW_DEFAULT_MODEL:-anthropic/claude-haiku-4-5}
    deploy:
      resources:
        limits:
          memory: 512m
    # Seed files are copied into the image; entrypoint plants them on first run
    healthcheck:
      test: ["CMD", "sh", "-c", "openclaw gateway health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  openclaw-work-state:
